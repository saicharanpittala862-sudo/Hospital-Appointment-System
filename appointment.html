<!DOCTYPE html>
<html>
<head>
    <title>Appointment Scheduling</title>
</head>
<body>

    <h1>Book Hospital Appointment</h1>
<h2>Appointment Scheduling Module</h2>
<p>Patients can select doctors and book appointments.</p>

    <form>
        Patient Name:
        <input type="text" required><br><br>

        Select Doctor:
        <select>
            <option>Dr. Rahul</option>
            <option>Dr. Priya</option>
            <option>Dr. Arjun</option>
        </select><br><br>

        Appointment Date:
        <input type="date" required><br><br>

        Appointment Time:
        <input type="time" required><br><br>

        <input type="submit" value="Book Appointment">
    </form>

</body>
</html>
