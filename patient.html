<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>
</head>
<body>

    <h1>Patient Registration</h1>
    <h2>Patient Registration Module</h2>
<p>Patients can register using their personal details.</p>
<p>Patient contact information is collected during registration.</p>

    <form>
        Patient Name:
        <input type="text" required><br><br>

        Age:
        <input type="number" required><br><br>

        Gender:
        <select>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select><br><br>

        Phone Number:
        <input type="tel" required><br><br>

        <input type="submit" value="Register">
    </form>

</body>
</html>
